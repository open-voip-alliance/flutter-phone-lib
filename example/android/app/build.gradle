plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

if (!file('google-services.json').exists()) {
    throw new GradleException('''
        |example/android/app/google-services.json is missing.
        |
        |The example app uses Vialer's application ID so its Firebase project can
        |be reused. Download "Android_Config_Vialer" from KeyHub and save it as
        |example/android/app/google-services.json (it is git-ignored):
        |
        |  https://keyhub.wearespindle.com/console/vaults/record-4f1086bf-d841-4951-a8df-d394c7cbacfb-Android_Config_Vialer
        |
        |Alternatively use the google-services.json of your own Firebase project
        |and change the applicationId in this file to match.
        '''.stripMargin())
}

android {
    namespace "nl.vialer.voip.vialer_voip_flutter_example"
    compileSdk 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // Vialer's ID so its Firebase project and middleware push credentials
        // can be reused; this means the example replaces Vialer on a device.
        applicationId "com.voipgrid.vialer"
        minSdkVersion 26
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}